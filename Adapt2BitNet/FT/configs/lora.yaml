data_config:
  train_file: train.jsonl
  val_file: test.jsonl
  test_file: test.jsonl
  num_proc: 1

combine: True
max_input_length: 1024
max_output_length: 128

training_args:
  do_train: True
  output_dir: ./output
  max_steps: 10000
  bf16: true
  learning_rate: 5e-5
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  dataloader_num_workers: 4
  remove_unused_columns: false
  save_strategy: steps
  save_steps: 2000
  log_level: info
  logging_strategy: steps
  logging_steps: 50
  do_eval: False
  evaluation_strategy: no
  per_device_eval_batch_size: 1
  eval_strategy: steps
  eval_steps: 500
  predict_with_generate: true
  generation_config:
    max_new_tokens: 128
  warmup_steps: 200
  weight_decay: 0.01

peft_config:
  peft_type: LORA
  task_type: CAUSAL_LM
  r: 8
  lora_alpha: 32
  lora_dropout: 0.1
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
